name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows PATH regression
        shell: powershell
        run: ./scripts/test-windows-path.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build MCP server
        run: cargo build -p workbar-mcp

      - name: MCP smoke test
        run: node scripts/smoke-mcp.js target/debug/workbar-mcp.exe

      - name: Storage, timer and native tests
        run: cargo test --workspace

      - name: Renderer regression
        run: node scripts/smoke-renderer.js

      - name: Check app crate
        run: cargo check -p workbar
