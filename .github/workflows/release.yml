name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$'
          if ($version -ne $appVersion -or $version -ne $cargoVersion.Matches.Groups[1].Value) {
            throw 'Package, app and Rust versions must match.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the app version.'
          }

      - name: Test storage, timers and native behavior
        run: cargo test --workspace --locked

      - name: Test task rendering
        run: node scripts/smoke-renderer.js

      - name: Build MCP server
        run: cargo build --release --locked -p workbar-mcp

      - name: Test release MCP server
        run: node scripts/smoke-mcp.js target/release/workbar-mcp.exe

      - name: Build app + installer
        run: npm run build -- --config src-tauri/tauri.release.conf.json --ci

      - name: Assemble portable package
        shell: pwsh
        run: |
          $packageDir = New-Item -ItemType Directory -Force dist/portable
          Copy-Item target/release/workbar.exe "$packageDir/Workbar.exe"
          Copy-Item target/release/workbar-mcp.exe "$packageDir/workbar-mcp.exe"
          Copy-Item scripts/portable/* $packageDir
          Copy-Item LICENSE $packageDir
          Get-ChildItem "$packageDir/*.ps1" | ForEach-Object {
            $content = [IO.File]::ReadAllText($_.FullName)
            [IO.File]::WriteAllText($_.FullName, $content, [Text.UTF8Encoding]::new($true))
          }
          Compress-Archive -Path "$packageDir/*" -DestinationPath dist/WorkBar-portable-win64.zip -Force
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/WorkBar-setup-win64.exe
          Copy-Item target/release/workbar-mcp.exe dist/workbar-mcp.exe

      - name: Verify portable package and create checksums
        shell: pwsh
        run: |
          Expand-Archive dist/WorkBar-portable-win64.zip dist/verify
          foreach ($name in @('Workbar.exe', 'workbar-mcp.exe', 'try-workbar.cmd', 'seed-demo.ps1', 'install.cmd', 'install.ps1', 'uninstall.cmd', 'uninstall.ps1', 'win-helpers.ps1', 'README-试用.txt', 'LICENSE')) {
            if (-not (Test-Path -LiteralPath "dist/verify/$name")) { throw "Missing package file: $name" }
          }
          node scripts/smoke-mcp.js dist/verify/workbar-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged MCP smoke test failed.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File dist/verify/seed-demo.ps1 -DataDir "$env:RUNNER_TEMP/workbar-demo-smoke" -NoStart
          if ($LASTEXITCODE -ne 0) { throw 'Packaged demo setup failed.' }
          Get-FileHash dist/WorkBar-setup-win64.exe,dist/WorkBar-portable-win64.zip,dist/workbar-mcp.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbar-windows
          path: |
            dist/WorkBar-setup-win64.exe
            dist/*.zip
            dist/workbar-mcp.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WorkBar ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/WorkBar-setup-win64.exe
            dist/*.zip
            dist/workbar-mcp.exe
            dist/SHA256SUMS.txt
