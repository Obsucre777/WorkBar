name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Tauri CLI
        run: npm install

      - name: Build MCP server
        run: cargo build --release -p workbar-mcp

      - name: Build app + installer
        run: npm run build

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/workbar.exe dist/Workbar.exe
          Copy-Item target/release/workbar-mcp.exe dist/workbar-mcp.exe
          Copy-Item scripts/portable/* dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/Workbar.exe,dist/workbar-mcp.exe -DestinationPath dist/Workbar-portable-win64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbar-windows
          path: |
            target/release/bundle/nsis/*.exe
            dist/*.zip
            dist/workbar-mcp.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            dist/*.zip
            dist/workbar-mcp.exe
          generate_release_notes: true
