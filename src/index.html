<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Workbar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <!-- collapsed state: one thin progress line at the very top edge -->
      <button id="slim" class="slim" type="button" title="展开 Workbar" aria-label="展开 Workbar">
        <span id="slimBar" class="slim-bar"></span>
        <span id="slimLine" class="slim-line" hidden></span>
      </button>

      <section id="bar" class="bar" data-state="active" aria-label="Workbar">
        <!-- one "current task" unit per task: current, parallel timers and what comes next -->
        <div id="units" class="units"></div>
        <span id="more" class="more" hidden></span>

        <div class="spacer" aria-hidden="true"></div>

        <div class="tail">
          <span id="progress" class="progress">0 / 0</span>
          <button id="collapse" class="ghost" type="button" title="收起成一条线" aria-label="收起">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5 12 8.5l6 6" /></svg>
          </button>
        </div>

        <div id="burst" class="burst" aria-hidden="true"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
