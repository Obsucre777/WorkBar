[workspace]
resolver = "2"
members = ["crates/workbar-core", "crates/workbar-mcp", "src-tauri"]

[workspace.package]
version = "0.0.5"
edition = "2021"
license = "MIT"
authors = ["Workbar contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
